name: Build EGX Stocks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34

      - name: Configure Buildozer and pin python-for-android
        run: |
          # Accept Android SDK licenses automatically
          sed -i '/android.accept_sdk_license/d' buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec

          # Use the stable p4a master branch
          sed -i 's/^p4a.branch = .*/p4a.branch = master/' buildozer.spec

          # IMPORTANT:
          # Pin python-for-android BEFORE the Python 3.14 change.
          # This commit still contains the PyProjectRecipe changes
          # while avoiding the Python 3.14 default.
          sed -i 's/^p4a.commit = .*/p4a.commit = c02cf78/' buildozer.spec

          echo "===== FINAL P4A CONFIGURATION ====="
          grep -E \
            'android.accept_sdk_license|p4a.branch|p4a.commit|android.api|android.ndk|android.archs|requirements' \
            buildozer.spec || true
          echo "===================================="

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer

      - name: Initialize python-for-android
        run: |
          buildozer android p4a -- --help

      - name: Verify pinned python-for-android
        run: |
          echo "===== P4A COMMIT ====="

          if [ -d ".buildozer/android/platform/python-for-android/.git" ]; then
            cd .buildozer/android/platform/python-for-android
            git rev-parse HEAD
            git log -1 --oneline
          else
            echo "ERROR: python-for-android repository was not found."
            exit 1
          fi

          echo "======================"

      - name: Verify Python recipe version
        run: |
          echo "===== PYTHON RECIPE VERSION ====="

          grep -n "version = " \
            .buildozer/android/platform/python-for-android/pythonforandroid/recipes/python3/__init__.py \
            | head -n 3

          echo "================================="

      - name: Build APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=========================================="
          echo "BUILD FAILED"
          echo "LAST 300 LINES"
          echo "=========================================="

          if [ -f build.log ]; then
            tail -n 300 build.log
          fi

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egx-stocks-apk
          path: bin/*.apk
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egx-stocks-apk
          path: bin/*.apk
          if-no-files-found: error
