name: Build EGX Stocks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "cython==0.29.34"

      - name: Enable Android SDK license
        run: |
          sed -i '/android.accept_sdk_license/d' buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          echo "SDK license setting:"
          grep -n "android.accept_sdk_license" buildozer.spec

      - name: Download Android SDK and NDK
        run: |
          buildozer android p4a -- --help

      - name: Verify AIDL
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK: $SDK"
          find "$SDK/build-tools" -type f -name aidl -perm -111 -print
          AIDL=$(find "$SDK/build-tools" -type f -name aidl -perm -111 | head -n 1)
          test -n "$AIDL"
          "$AIDL" --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Verify APK
        run: |
          ls -lah bin/
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk')"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egx-stocks-apk
          path: bin/*.apk
