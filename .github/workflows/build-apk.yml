name: Build EGX Stocks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3.4"

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          text = path.read_text()

          # Remove previous values that may conflict
          lines = text.splitlines()
          new_lines = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("p4a.branch"):
                  continue

              if stripped.startswith("p4a.commit"):
                  continue

              if stripped.startswith("android.accept_sdk_license"):
                  continue

              new_lines.append(line)

          text = "\n".join(new_lines) + "\n"

          # Insert the required settings immediately after [app]
          marker = "[app]"
          settings = (
              "android.accept_sdk_license = True\n"
              "p4a.branch = master\n"
              "p4a.commit = 58d2114\n"
          )

          if marker not in text:
              raise SystemExit("ERROR: [app] section not found in buildozer.spec")

          text = text.replace(
              marker + "\n",
              marker + "\n" + settings,
              1
          )

          path.write_text(text)
          PY

          echo "===== Buildozer settings ====="
          grep -E \
            'android.accept_sdk_license|p4a.branch|p4a.commit|android.api|android.ndk|android.archs|requirements' \
            buildozer.spec || true
          echo "=============================="

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer

      - name: Initialize python-for-android
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show useful build information on failure
        if: failure()
        run: |
          echo ""
          echo "=============================================="
          echo "BUILD FAILED - LAST 300 LOG LINES"
          echo "=============================================="

          if [ -f build.log ]; then
            tail -n 300 build.log
          else
            echo "build.log was not created."
          fi

      - name: Verify APK
        run: |
          echo "=============================================="
          echo "APK FILES"
          echo "=============================================="

          find bin -maxdepth 1 -type f -name "*.apk" -print

          APK_COUNT=$(find bin -maxdepth 1 -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was created."
            exit 1
          fi

          echo ""
          echo "APK successfully created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egx-stocks-apk
          path: bin/*.apk
          if-no-files-found: error
